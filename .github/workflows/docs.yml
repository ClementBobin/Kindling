name: Docs

# Builds the documentation website (website/) and deploys it to GitHub Pages.
#   - push to main touching code or docs  -> regenerate from KDoc, build, deploy
#   - release                              -> same, stamped with the release version
#   - pull request                         -> build + verify generated docs are up to date (no deploy)
#   - manual (workflow_dispatch)           -> optionally run the AI draft job and open a PR
on:
  push:
    branches: [main]
    paths: ['website/**', 'showcase/**', 'core/**', 'utils/**', 'compose/**', 'android/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', 'showcase/**', 'core/**', 'utils/**', 'compose/**', 'android/**', '.github/workflows/docs.yml']
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      ai_drafts:
        description: 'Draft docs for thin pages with Claude and open a PR'
        type: boolean
        default: false
      ai_limit:
        description: 'Max pages to draft'
        default: '5'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Compose for Web showcase (live previews) ───────────────────────────
  showcase:
    name: Build Wasm showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :showcase:wasmJsBrowserDistribution --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: showcase/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

  # ── 2. Website ────────────────────────────────────────────────────────────
  site:
    name: Build website
    needs: showcase
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      NEXT_PUBLIC_LIBRARY_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci

      - name: Verify generated docs are up to date
        if: github.event_name == 'pull_request'
        run: npm run docs:check

      - uses: actions/download-artifact@v4
        with:
          name: showcase
          path: website/public/showcase

      - name: Build static site
        run: npm run build   # prebuild regenerates the API pages from KDoc

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.ai_drafts)
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── 3. Optional AI drafts, reviewed through a PR ──────────────────────────
  ai-drafts:
    name: AI drafts → pull request
    if: github.event_name == 'workflow_dispatch' && inputs.ai_drafts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run docs:generate
      - name: Draft pages with Claude
        run: npm run docs:ai -- --limit=${{ inputs.ai_limit }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/ai-drafts
          title: 'docs: AI-drafted pages (review required)'
          commit-message: 'docs: AI-drafted pages'
          body: |
            Drafted by `website/scripts/ai-draft.mjs` for pages the generator flagged as thin.
            Drafts live in `website/docs-extra/` and are injected into the generated pages.
            **Review every page** before merging: edit freely, the generator never overwrites them.
          add-paths: website/docs-extra/**
