name: Docs

# The documentation site is the :showcase module (Compose Multiplatform for Web) fed by docs-gen/.
#   - push to main / release  -> regenerate from KDoc, build, deploy to GitHub Pages
#   - pull request            -> verify generated docs are up to date + build (no deploy)
#   - manual (workflow_dispatch) with ai_drafts -> draft thin pages with Claude and open a PR
on:
  push:
    branches: [main]
    paths: ['showcase/**', 'docs-gen/**', 'core/**', 'utils/**', 'compose/**', 'android/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['showcase/**', 'docs-gen/**', 'core/**', 'utils/**', 'compose/**', 'android/**', '.github/workflows/docs.yml']
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      ai_drafts:
        description: 'Draft docs for thin pages with Claude and open a PR'
        type: boolean
        default: false
      ai_limit:
        description: 'Max pages to draft'
        default: '5'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ai_drafts) }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify generated docs are up to date
        if: github.event_name == 'pull_request'
        run: node docs-gen/scripts/docgen.mjs --check

      - name: Regenerate docs from KDoc
        if: github.event_name != 'pull_request'
        run: node docs-gen/scripts/docgen.mjs

      - name: Build Compose Wasm site
        run: ./gradlew :showcase:wasmJsBrowserDistribution --no-daemon

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: showcase/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.ai_drafts)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  ai-drafts:
    name: AI drafts → pull request
    if: github.event_name == 'workflow_dispatch' && inputs.ai_drafts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node docs-gen/scripts/docgen.mjs
      - name: Draft pages with Claude
        run: node docs-gen/scripts/ai-draft.mjs --limit=${{ inputs.ai_limit }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/ai-drafts
          title: 'docs: AI-drafted pages (review required)'
          commit-message: 'docs: AI-drafted pages'
          body: |
            Drafted by `docs-gen/scripts/ai-draft.mjs` for pages the generator flagged as thin.
            Drafts live in `docs-gen/extra/` and are injected into the generated pages.
            **Review every page** before merging; the generator never overwrites them.
          add-paths: docs-gen/extra/**
