name: Publish
on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 23

      - name: Publish to MavenCentral
        # RELEASE_VERSION is read by Versions.kt to set the artifact version.
        # github.event.release.tag_name is the Git tag that triggered this
        # workflow (e.g. "v0.2.0" or "0.2.0") — the leading "v" is stripped
        # inside Versions.kt.
        # :sample is a local Android app — excluded explicitly.
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
