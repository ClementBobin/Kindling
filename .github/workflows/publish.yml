name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}-v2
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Debug secrets presence
        run: |
          echo "GPG_KEY_ID is set: ${{ secrets.GPG_KEY_ID != '' }}"
          echo "GPG_KEY is set: ${{ secrets.GPG_KEY != '' }}"
          echo "GPG_PASSPHRASE is set: ${{ secrets.GPG_PASSPHRASE != '' }}"
          echo "OSSRH_USERNAME is set: ${{ secrets.OSSRH_USERNAME != '' }}"
          echo "OSSRH_PASSWORD is set: ${{ secrets.OSSRH_PASSWORD != '' }}"
          # Print first 4 chars of KEY_ID to verify it's the right one (safe to show)
          echo "GPG_KEY_ID starts with: ${GPG_KEY_ID:0:4}"
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

      - name: Publish
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publish --no-daemon
